name: Build and Notarize

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download whisper.cpp binaries
      run: node scripts/download-whisper-cpp.js --current --platform darwin --arch ${{ matrix.arch }}

    - name: Cache Electron
      uses: actions/cache@v4
      with:
        path: ~/.cache/electron
        key: macos-electron-${{ hashFiles('**/package-lock.json') }}
        restore-keys: macos-electron-

    # Signing requires Apple Developer secrets. Forks without them still get an
    # unsigned DMG (Gatekeeper warning on open, but the app works).
    - name: Detect signing secrets
      id: signing
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      run: |
        if [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Signing enabled"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Signing disabled (missing secrets or pull request) — building unsigned DMG"
        fi

    - name: Setup macOS Code Signing
      if: steps.signing.outputs.enabled == 'true'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        API_KEY_PATH=$RUNNER_TEMP/api_key.p8
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
        echo "$APPLE_API_KEY_BASE64" | base64 --decode > $API_KEY_PATH

        security create-keychain -p "runner" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "runner" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        security set-key-partition-list -S apple-tool:,apple: -s -k "runner" $KEYCHAIN_PATH

        echo "APPLE_API_KEY=$API_KEY_PATH" >> $GITHUB_ENV

    - name: Build DMG (${{ matrix.arch }})
      run: npm run build:mac -- --${{ matrix.arch }} --publish never
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.enabled }}
        CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.arch }}-dmg
        path: |
          dist/*.dmg
          dist/*.zip
        retention-days: 7

    - name: Cleanup Certificates
      if: always() && steps.signing.outputs.enabled == 'true'
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
        rm -f $RUNNER_TEMP/build_certificate.p12
        rm -f $RUNNER_TEMP/api_key.p8
